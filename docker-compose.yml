services:
  # ── Infrastructure ───────────────────────────────────────────────────────

  mongo:
    image: mongo:7
    container_name: cake-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cake-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cake-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cake-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cake-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - cake-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Microservices ────────────────────────────────────────────────────────

  catalog-service:
    build: ./catalog-service
    container_name: cake-catalog
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/catalog-db
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cake-net
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: cake-order
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/order-db
      CATALOG_URL: http://catalog-service:3001
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - cake-net
    restart: on-failure

  rating-service:
    build: ./rating-service
    container_name: cake-rating
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/rating-db
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cake-net
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: cake-notification
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongo:27017/notification-db
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cake-net
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: cake-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/gateway-db
      CATALOG_URL: http://catalog-service:3001
      ORDER_URL: http://order-service:3002
      RATING_URL: http://rating-service:3003
      NOTIFICATION_URL: http://notification-service:3004
      JWT_SECRET: cake-delight-secret-key-change-me
      JWT_EXPIRES_IN: 24h
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      rating-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - cake-net
    restart: on-failure

  # ── Frontend ─────────────────────────────────────────────────────────────

  ui:
    build: ./UI
    container_name: cake-ui
    ports:
      - "8080:8080"
    depends_on:
      - api-gateway
    networks:
      - cake-net
    restart: on-failure

volumes:
  mongo-data:

networks:
  cake-net:
    driver: bridge
