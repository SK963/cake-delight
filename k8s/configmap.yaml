apiVersion: v1
kind: ConfigMap
metadata:
  name: cake-delight-config
  namespace: cake-delight
data:
  CATALOG_MONGO_URI: "mongodb://mongo:27017/catalog-db"
  ORDER_MONGO_URI: "mongodb://mongo:27017/order-db"
  RATING_MONGO_URI: "mongodb://mongo:27017/rating-db"
  NOTIFICATION_MONGO_URI: "mongodb://mongo:27017/notification-db"
  GATEWAY_MONGO_URI: "mongodb://mongo:27017/gateway-db"
  KAFKA_BROKERS: "kafka:9092"
  CATALOG_URL: "http://catalog-service:3001"
  ORDER_URL: "http://order-service:3002"
  RATING_URL: "http://rating-service:3003"
  NOTIFICATION_URL: "http://notification-service:3004"
  JWT_SECRET: "cake-delight-secret-key-change-me"
  JWT_EXPIRES_IN: "24h"
  LOG_LEVEL: "info"
